[package]
name = "instrid"
version = "0.1.0"
edition = "2024"
description = "Financial instrument identification types"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }
tradeprim = { path = "../tradeprim" }

[dev-dependencies]
proptest = "1.11.0"
serde_json = { version = "1" }

[build-dependencies]
csv = { version = "1" }

[features]
default = []
mic-full = []
serde = ["dep:serde", "tradeprim/serde"]
