# Dependency cooldown (Rust 1.100+): `cargo update` and new resolutions skip versions published
# less than 3 days ago, so a compromised release has time to be noticed and yanked first.
# Not applied by `cargo install`. One-off override for an urgent fix:
#   CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update <crate> --precise <version>
[registry]
global-min-publish-age = "3 days"
