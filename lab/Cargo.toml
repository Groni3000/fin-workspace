[package]
name = "lab"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10.4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tradeprim = { path = "../tradeprim" }
instrid = { path = "../instrid", features = ["mic-full"] }
futchain = { path = "../futchain" }
# `cmake-build` compiles librdkafka from C source, needing cmake + a C toolchain.
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }
oms = { path = "../oms" }


[features]
default = []
kafka = ["dep:rdkafka"]

[[bin]]
name = "kafka_check"
required-features = ["kafka"]

[[bin]]
name = "generic_test"
required-features = ["kafka"]
