[package]
name = "lab"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10.4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tradeprim = { path = "../tradeprim", features = ["serde"] }
instrid = { path = "../instrid", features = ["mic-full"] }
futchain = { path = "../futchain" }
# `cmake-build` compiles librdkafka from C source, needing cmake + a C toolchain.
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }
ctrlc = { version = "3", optional = true }
oms = { path = "../oms" }
# `release_max_level_info` compiles trace!/debug! out entirely in release builds.
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }


[features]
default = []
kafka = ["dep:rdkafka", "dep:ctrlc"]

[[bin]]
name = "kafka_check"
required-features = ["kafka"]

[[bin]]
name = "generic_test"
required-features = ["kafka"]

[[bin]]
name = "strat_1"
required-features = ["kafka"]
